[package]
name = "patch_refiner"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"], optional=true}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diffy = "0.5"
wait-timeout = "0.2.1"
prettydiff = "0.9.0"
thiserror = "2.0.20"

[features]
cli = ["clap"]

[[bin]]
name = "patch-refiner"
required-features = ["cli"]
